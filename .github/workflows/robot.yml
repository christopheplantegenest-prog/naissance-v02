# ROBOT DE LIVRAISON — version du robot : 2 (livraison séparée, AT-9)
#
# Déclencheur : un fichier .zip envoyé à la RACINE de main par le
# propriétaire du dépôt. Un seul colis par passage.
#
# Trois jobs, trois niveaux de confiance :
#  - inventaire (confiance) : décrit le colis et calcule l'arbre attendu,
#    sans exécuter aucun code du colis. Lecture seule, aucun secret.
#  - controle (NON fiable) : reconstruit le même arbre puis exécute la
#    vérification de l'application et, si demandé, l'APK. Le code du colis
#    s'exécute ici : lecture seule, aucun secret, sorties jamais crues.
#  - livraison (environnement « livraison », approbation de Christophe) :
#    seul job qui reçoit la clé de l'application naissance-livraison.
#    N'exécute que deballer.py (bibliothèque standard), git et gh : aucun
#    test, aucun npm, aucun Gradle, aucun code du colis. Reconstruit
#    lui-même le commit, le confronte à l'inventaire, pousse main +
#    étiquette en une fois (push --atomic, sans rebase), puis l'APK.
# Ensuite : site (prépare GitHub Pages depuis le commit livré) et publier.
#
# Anti-boucle : branche main seule, propriétaire seul, messages du robot
# en [skip ci], le robot retire le zip qu'il a traité.
#
# Refus (L3a) : un colis refusé par l'inventaire ou par le contrôle arrête
# le passage en rouge SANS solliciter l'approbation : rien n'est écrit,
# le zip reste sur main, Christophe le retire à la main (motif dans le
# résumé du passage). Seule une livraison demande l'approbation.
# Relance (L3a) : un passage ne traite que le commit qui l'a déclenché ;
# si main a avancé, il s'arrête (y compris sur « Re-run »). Relancer =
# renvoyer le colis (nouveau commit).
#
# Ce dossier (.github/workflows) est interdit aux colis : le robot ne peut
# être modifié que par un envoi manuel dans ce dossier.
# Retour arrière : re-déposer robot.yml 25d2eefa + deballer.py 83fcd2b6.
#
# v0.66.0 (ATELIER AUTONOME, L7) : second déclencheur, le DÉPÔT PROPOSÉ PAR L'ATELIER. workflow_dispatch avec l'entrée « depot » =
# SHA d'un commit D' (branche livraison/…) dont le parent UNIQUE est la tête actuelle de main et qui n'ajoute QU'UN zip à la racine
# (contrôlé par deballer.py depot avant tout). Lancé par l'opérateur atelier-chantier.yml (github-actions[bot]) ou par le propriétaire.
# Tout le reste est inchangé : inventaire, contrôle, approbation V4 de Christophe (environnement livraison), commit du robot sur D'
# (main avance en avance rapide : main -> D' -> livraison), étiquette, APK, site.

name: Robot de livraison

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '*.ZIP'
  workflow_dispatch:
    inputs:
      depot:
        description: "Dépôt de l'atelier : SHA du commit D' (vide = republication du site)"
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: robot-de-livraison
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  inventaire:
    name: Inventaire (confiance, sans code du colis)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'christopheplantegenest-prog/naissance-v02' &&
      ((github.event_name == 'push' &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner) ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.depot != '' &&
        (github.actor == 'github-actions[bot]' || github.actor == github.repository_owner)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.inventaire2.outputs.decision }}
      motif: ${{ steps.inventaire2.outputs.motif }}
      base_sha: ${{ steps.inventaire2.outputs.base_sha }}
      zip_blob: ${{ steps.inventaire2.outputs.zip_blob }}
      zip_sha256: ${{ steps.inventaire2.outputs.zip_sha256 }}
      version: ${{ steps.inventaire2.outputs.version }}
      apk: ${{ steps.inventaire2.outputs.apk }}
      description: ${{ steps.inventaire2.outputs.description }}
      arbre_attendu: ${{ steps.inventaire2.outputs.arbre_attendu }}
    steps:
      - name: Récupérer exactement le commit déclencheur (ou le dépôt de l'atelier)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.depot || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exiger que main soit encore le commit déclencheur (dépôt de l'atelier — parent unique = main)
        env:
          ROBOT_DEPOT: ${{ inputs.depot }}
        run: |
          if [ -n "$ROBOT_DEPOT" ]; then
            python3 -I .github/workflows/deballer.py depot
            exit $?
          fi
          distant=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$distant" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "main a avancé depuis le déclenchement : passage arrêté, rien n'est écrit."
            echo "## ⛔ main a avancé depuis le déclenchement : passage arrêté (renvoyer le colis pour relancer)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Compter les colis
        id: compte
        run: python3 -I .github/workflows/deballer.py inventaire

      - name: Inventaire du colis (aucun code du colis)
        id: inventaire2
        if: steps.compte.outputs.colis != '0'
        run: python3 -I .github/workflows/deballer.py inventaire2

      - name: Joindre le contrat d'inventaire
        if: always() && steps.compte.outputs.colis != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contrat-inventaire
          path: ${{ runner.temp }}/contrat.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Signaler un colis refusé par l'inventaire (sans approbation)
        if: steps.inventaire2.outputs.decision == 'refuser'
        run: |
          echo "Colis refusé par l'inventaire : rien n'est écrit, retirer le zip à la main."
          exit 1

  controle:
    name: Contrôle (code du colis, sorties non fiables)
    needs: inventaire
    if: needs.inventaire.outputs.decision == 'controler'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.controler.outputs.verdict }}
      motif: ${{ steps.controler.outputs.motif }}
      arbre_teste: ${{ steps.controler.outputs.arbre_teste }}
      apk_sha256: ${{ steps.controler.outputs.apk_sha256 }}
    steps:
      - name: Récupérer exactement la base de l'inventaire
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.inventaire.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Installer le navigateur de vérification
        run: |
          mkdir -p "$RUNNER_TEMP/outils"
          cd "$RUNNER_TEMP/outils"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Installer Java (seulement si un APK est demandé)
        if: needs.inventaire.outputs.apk == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Contrôler le colis (sorties NON fiables)
        id: controler
        env:
          INV_BASE_SHA: ${{ needs.inventaire.outputs.base_sha }}
          INV_ARBRE: ${{ needs.inventaire.outputs.arbre_attendu }}
          INV_ZIP_SHA256: ${{ needs.inventaire.outputs.zip_sha256 }}
        run: python3 -I .github/workflows/deballer.py controler

      - name: Joindre le rapport du contrôle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapport-du-controle
          path: ${{ runner.temp }}/rapport
          if-no-files-found: ignore
          retention-days: 30

      - name: Joindre l'APK du contrôle
        if: steps.controler.outputs.verdict == 'ok' && needs.inventaire.outputs.apk == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-controle
          path: ${{ runner.temp }}/controle-apk/app.apk
          if-no-files-found: error
          retention-days: 7

      - name: Signaler un colis refusé par le contrôle (sans approbation)
        if: steps.controler.outputs.verdict != 'ok'
        run: |
          echo "Colis refusé par le contrôle : rien n'est écrit, retirer le zip à la main."
          exit 1

  livraison:
    name: Livraison (approbation, application naissance-livraison)
    needs: [inventaire, controle]
    if: >-
      !cancelled() &&
      needs.inventaire.result == 'success' &&
      needs.inventaire.outputs.decision == 'controler' &&
      needs.controle.result == 'success' &&
      needs.controle.outputs.verdict == 'ok'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: livraison
    permissions:
      contents: read
    outputs:
      livre: ${{ steps.livrer.outputs.livre }}
      commit: ${{ steps.livrer.outputs.commit }}
    steps:
      - name: Jeton de l'application naissance-livraison (après approbation)
        id: jeton
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LIVRAISON_CLIENT_ID }}
          private-key: ${{ secrets.LIVRAISON_CLE_PRIVEE }}
          permission-contents: write

      - name: Récupérer exactement la base de l'inventaire
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.inventaire.outputs.base_sha }}
          fetch-depth: 0
          token: ${{ steps.jeton.outputs.token }}
          # nécessaire au push de deballer.py ; ce job n'envoie aucun artefact ;
          # retiré par checkout puis jeton révoqué en fin de job
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Récupérer l'APK du contrôle (vérifié ensuite par empreinte)
        if: >-
          needs.inventaire.outputs.decision == 'controler' &&
          needs.controle.outputs.verdict == 'ok' &&
          needs.inventaire.outputs.apk == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk-controle
          path: ${{ runner.temp }}/controle-apk

      - name: Livrer (deballer.py seul, aucun code du colis)
        id: livrer
        env:
          INV_DECISION: ${{ needs.inventaire.outputs.decision }}
          INV_MOTIF: ${{ needs.inventaire.outputs.motif }}
          INV_BASE_SHA: ${{ needs.inventaire.outputs.base_sha }}
          INV_ZIP_BLOB: ${{ needs.inventaire.outputs.zip_blob }}
          INV_ZIP_SHA256: ${{ needs.inventaire.outputs.zip_sha256 }}
          INV_ARBRE: ${{ needs.inventaire.outputs.arbre_attendu }}
          INV_VERSION: ${{ needs.inventaire.outputs.version }}
          CTL_VERDICT: ${{ needs.controle.outputs.verdict }}
          CTL_MOTIF: ${{ needs.controle.outputs.motif }}
          CTL_ARBRE: ${{ needs.controle.outputs.arbre_teste }}
          CTL_APK_SHA256: ${{ needs.controle.outputs.apk_sha256 }}
          ROBOT_DEPOT: ${{ inputs.depot }}
        run: python3 -I .github/workflows/deballer.py livrer

      - name: Publier l'APK dans les Releases
        if: steps.livrer.outputs.livre == 'true' && steps.livrer.outputs.apk == 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ steps.jeton.outputs.token }}
          VERSION_LIVREE: ${{ steps.livrer.outputs.version }}
          DESCRIPTION: ${{ needs.inventaire.outputs.description }}
          APK_ANNONCE: ${{ needs.controle.outputs.apk_sha256 }}
        run: |
          [[ "$VERSION_LIVREE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version livrée illisible"; exit 1; }
          [ -f controle-apk/app.apk ] && [ ! -L controle-apk/app.apk ] || { echo "APK absent"; exit 1; }
          mkdir -p publication
          cp controle-apk/app.apk "publication/naissance-v$VERSION_LIVREE.apk"
          empreinte=$(sha256sum "publication/naissance-v$VERSION_LIVREE.apk" | cut -d' ' -f1)
          [ "$empreinte" = "$APK_ANNONCE" ] || { echo "APK modifié depuis la livraison"; exit 1; }
          gh release create "v$VERSION_LIVREE" "publication/naissance-v$VERSION_LIVREE.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Naissance v$VERSION_LIVREE" \
            --notes "${DESCRIPTION:-Version $VERSION_LIVREE}"
          echo "- 📦 APK v$VERSION_LIVREE publié (sha256 $empreinte)" >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Préparer le site
    needs: [livraison]
    if: >-
      !cancelled() &&
      github.repository == 'christopheplantegenest-prog/naissance-v02' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.depot == '' &&
        github.ref == 'refs/heads/main' &&
        github.actor == github.repository_owner) ||
       needs.livraison.outputs.livre == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      nom: ${{ steps.envoi.outputs.nom }}
    steps:
      - name: Récupérer le commit livré (ou main pour une republication)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.livraison.outputs.commit || github.sha }}
          persist-credentials: false

      - name: Préparer le site
        run: python3 -I .github/workflows/deballer.py site

      - name: Archiver le site
        id: envoi
        run: |
          tar --dereference --hard-dereference --directory "$RUNNER_TEMP/site" \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
          echo "nom=site-$GITHUB_RUN_ID-$(python3 -I -c 'import secrets; print(secrets.token_hex(16))')" >> "$GITHUB_OUTPUT"

      - name: Envoyer le site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.envoi.outputs.nom }}
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  reveil:
    name: Réveil de l'atelier (dépôt de l'atelier seulement)
    # Un passage lancé par le jeton des workflows ne déclenche pas workflow_run : la fin du robot (livré, refusé ou non approuvé)
    # relance donc explicitement la veille de l'atelier (workflow_dispatch, seule exception de GitHub). Aucune action, aucun secret.
    needs: [inventaire, livraison]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.depot != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # relance de atelier-chantier.yml
    steps:
      - name: Relancer la veille de l'atelier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atelier-chantier.yml --repo "$GITHUB_REPOSITORY" --ref main -f ticket=veille

  publier:
    name: Publier le site
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # créer le déploiement GitHub Pages
      id-token: write # jeton OIDC exigé par deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ needs.site.outputs.nom }}
