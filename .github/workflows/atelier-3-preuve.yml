# PREUVE RÉELLE DE L'ATELIER 3 (GO « ATELIER 3 — PRÉPARATION », point 1) — OUTILLAGE NON COGNITIF.
# Tourne sur les machines GitHub (dépôt public : 0 $), SANS AUCUN SECRET, en lecture seule, à l'ouverture et à chaque poussée de la
# PR P1 (branche depot/atelier-3 de CE dépôt), ou à la main (workflow_dispatch) après la fusion. Ne livre rien, n'écrit rien, n'appelle
# aucune API payante. Deux preuves :
#   1. navigateur : la suite complète (dont tests/atelier-3-boucle.test.mjs : joueur Chromium réel, bout en bout, contre-épreuves) ;
#   2. apk : compile, par le code même du robot (deballer.py apk-preuve), l'APK de production (armeabi-v7a, téléphone) et la variante
#      d'essai x86_64 (émulateur) du commit, et exige que seule la bibliothèque native diffère (GO option A du 27/10) ;
#   3. android : un VRAI émulateur (KVM de la machine GitHub, Android 14, WebView 113) installe la variante d'essai et le joueur
#      d'acceptation y joue un scénario qui doit RÉUSSIR, puis un qui doit ÉCHOUER (le joueur sait dire non). Limite : émulateur ≠ téléphone.
name: Preuve Atelier 3

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preuve-atelier-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigateur:
    name: Preuve navigateur (suite complète, joueur Chromium réel)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'depot/atelier-3' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Récupérer le commit exact
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Installer les dépendances et le navigateur
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Suite complète
        run: |
          git config --global user.name preuve
          git config --global user.email preuve@example.invalid
          ATELIER_EXIGER_NAVIGATEUR=1 node --test tests/*.test.mjs > "$RUNNER_TEMP/suite.log" 2>&1; code=$?
          tail -n 12 "$RUNNER_TEMP/suite.log"
          grep -E '^not ok' "$RUNNER_TEMP/suite.log" | head -n 40 || true
          { echo '## Preuve navigateur'; echo; grep -E '^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/suite.log" | sed 's/^# /- /'; } >> "$GITHUB_STEP_SUMMARY"
          # Détail des échecs en ANNOTATION (lisible par l'API même quand les journaux ne le sont pas).
          if [ "$code" -ne 0 ]; then
            detail="$(grep -E -A16 '^not ok' "$RUNNER_TEMP/suite.log" | head -n 160 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=Tests en échec::${detail}"
          fi
          exit $code

  apk:
    name: Variantes de l'APK (production armeabi-v7a, essai x86_64), comparées
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'depot/atelier-3' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Récupérer le commit exact
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler et comparer les deux variantes (code du robot)
        run: |
          python3 -I .github/workflows/deballer.py apk-preuve
          # Comparaison et bibliothèques natives en ANNOTATION (lisibles par l'API même quand les journaux ne le sont pas).
          resume="$(python3 -I -c 'import json,sys; c=json.load(open(sys.argv[1])); print(" ; ".join(f"{k}={v}" for k, v in c.items()))' "$RUNNER_TEMP/apk-preuve/comparaison.json")"
          echo "::notice title=Variantes de l'APK::${resume}"
          # Témoin : l'APK publié v0.66.14 (téléphone) n'a lui aussi que la bibliothèque armeabi-v7a.
          curl -fsSL -o "$RUNNER_TEMP/publie.apk" https://github.com/christopheplantegenest-prog/naissance-v02/releases/download/v0.66.14/naissance-v0.66.14.apk
          libs="$(python3 -I -c 'import zipfile,sys; print(" ".join(sorted(n for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.startswith("lib/"))))' "$RUNNER_TEMP/publie.apk")"
          echo "::notice title=APK publié v0.66.14 (témoin)::${libs}"

      - name: Joindre les variantes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-preuve
          path: |
            ${{ runner.temp }}/apk-preuve/essai.apk
            ${{ runner.temp }}/apk-preuve/production.apk
            ${{ runner.temp }}/apk-preuve/comparaison.json
            ${{ runner.temp }}/apk-preuve/journal.txt
          if-no-files-found: ignore
          retention-days: 30

  android:
    name: Preuve Android (vrai émulateur Android 14, variante d'essai x86_64)
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Récupérer le commit exact
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Récupérer la variante d'essai
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk-preuve
          path: ${{ runner.temp }}/apk

      - name: Démarrer l'émulateur Android (KVM de la machine GitHub)
        timeout-minutes: 35
        run: |
          bash .github/workflows/demarrer-emulateur.sh "$RUNNER_TEMP"

      - name: Scénarios (un qui doit réussir, un qui doit échouer)
        run: |
          mkdir -p "$RUNNER_TEMP/juge"
          cp outils-atelier/auto-scenario.mjs "$RUNNER_TEMP/juge/"
          cd "$RUNNER_TEMP/juge"
          apk="$RUNNER_TEMP/apk/essai.apk"
          paquet="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["appId"])' "$GITHUB_WORKSPACE/capacitor.config.json")"
          cat > vert.json <<'FIN'
          {"but": "Naissance démarre sur un vrai Android, survit à l'écran éteint et reste vivante", "navigateur": [{"action": "voir", "texte": "Naissance"}], "android": [
            {"action": "lancer"}, {"action": "attendre", "ms": 240000}, {"action": "voir", "texte": "Faire naître Naissance"},
            {"action": "ecran_eteint"}, {"action": "attendre", "ms": 20000}, {"action": "ecran_allume"}, {"action": "processus_vivant"},
            {"action": "voir", "texte": "Faire naître Naissance"}]}
          FIN
          cat > rouge.json <<'FIN'
          {"but": "Contre-épreuve : un texte absent de l'application doit faire échouer le joueur", "navigateur": [{"action": "voir", "texte": "Naissance"}], "android": [
            {"action": "lancer"}, {"action": "attendre", "ms": 10000}, {"action": "voir", "texte": "Texte absent de Naissance"}]}
          FIN
          empreinte() { JUGE="$RUNNER_TEMP/juge/auto-scenario.mjs" FICHIER="$1" node -e 'import(process.env.JUGE).then((S) => { const l = S.lireScenario(JSON.parse(require("fs").readFileSync(process.env.FICHIER, "utf8"))); if (l.raison) { console.error(l.raison); process.exit(1); } console.log(S.empreinteScenario(l.scenario)); })'; }
          node auto-scenario.mjs android --scenario vert.json --empreinte "$(empreinte vert.json)" --apk "$apk" --paquet "$paquet" --sortie vert-resultat.json
          node auto-scenario.mjs android --scenario rouge.json --empreinte "$(empreinte rouge.json)" --apk "$apk" --paquet "$paquet" --sortie rouge-resultat.json
          v="$(node -p 'require("./vert-resultat.json").verdict')"; r="$(node -p 'require("./rouge-resultat.json").verdict')"
          # Verdicts et motifs en ANNOTATION (lisibles par l'API même quand les journaux ne le sont pas).
          motifs="$(node -p 'const m = (f) => { const x = require(f); return `${x.verdict} — ${String(x.motif).replace(/[\r\n%]/g, " ")}`; }; `vert : ${m("./vert-resultat.json")} | rouge : ${m("./rouge-resultat.json")}`')"
          if [ "$v" = ok ] && [ "$r" = echec ]; then echo "::notice title=Preuve Android::${motifs}"; else echo "::error title=Preuve Android::${motifs}"; fi
          # Contexte de l'émulateur (version du WebView, messages de la page) : annotation de diagnostic, sans effet sur le verdict.
          webview="$(adb shell dumpsys package com.google.android.webview 2>/dev/null | grep -m1 versionName | tr -d '\r' | sed 's/^ *//')"
          abi="$(adb shell dumpsys package "$paquet" 2>/dev/null | grep -m1 primaryCpuAbi | tr -d '\r' | sed 's/^ *//')"
          console="$(adb logcat -d 2>/dev/null | grep -E 'Capacitor/Console|SyntaxError|TypeError|naissance' | tail -n 15 | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print substr($0, 1, 200)}')"
          echo "::notice title=Émulateur (contexte)::WebView ${webview:-inconnu} ; ${abi:-abi inconnue}%0A${console}"
          { echo '## Preuve Android (émulateur, pas un téléphone)'; echo; echo "- scénario qui doit réussir : **$v**"; echo "- contre-épreuve qui doit échouer : **$r**"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$v" = ok ] && [ "$r" = echec ]

      - name: Joindre les preuves
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preuve-android
          path: |
            ${{ runner.temp }}/juge/*.json
            ${{ runner.temp }}/emulateur.log
          if-no-files-found: ignore
          retention-days: 30
