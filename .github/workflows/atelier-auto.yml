# ATELIER — AUTO (à blanc, ou témoin réel : UNE requête au plus)
# v0.65.9 — AT-8.1 (D-007) ; v0.65.10 — AT-8.2 « témoin » (préparé, NON installé). OUTILLAGE NON COGNITIF — aucune acquisition de Naissance.
#
# Une exécution pour l'identité T = <chantier>/<jalon>/<numero>, déclenchée UNE fois par Claude sur collage de la demande AUTO.
# - J1 garde : lit (jeton contents:read + actions:read) la tête de journal-atelier/<chantier> et l'historique des runs de ce
#   workflow, puis la garde pure (app/atelier/auto.js) décide. Refus => sortie 1 => J2 n'est jamais lancé, aucune attente.
# - J2 frontière et appel : environnement atelier-auto (approbation de Christophe, branche main seule). Relit l'état, l'approbation,
#   sonde l'écriture du jeton (doit être refusée), frontière PRET_A_APPELER ; puis, SEULEMENT pour une tentative portant un témoin,
#   préparation (aucune requête) et UNE requête au plus (outils-atelier/auto-appel.mjs, node:https, sans SDK ni relance, 60 s).
#   La clé n'existe que si Christophe a créé le secret d'environnement ATELIER_TEMOIN_CLE ; sans lui : non-emis « cle-absente ».
#   La clé n'est exposée qu'à l'étape « Appel (une seule requête) ».
# - J3 constat : if: always(), sans environnement ni secret, lit les jobs de CE run (actions:read) et constate l'issue (auto-constat.mjs) :
#   non-emis seulement si GitHub montre l'étape d'appel sautée ; sinon issue-inconnue (jamais un coût 0 par absence de preuve).
# - v0.65.13 — AT-9.1 « appel de développement » (préparé, NON installé) : pour une tentative portant un développement, J2 lit
#   aussi le contenu à la base des fichiers autorisés (auto-dossier.mjs, sans réseau), puis la même UNIQUE requête transmet le
#   dossier (délai <= 20 min). Réponse connue ET proposition valide : J2 conserve la proposition (artefact de CE run).
# - AT-9.2 « remplacements exacts » : seuls les EXTRAITS déclarés au lancement sont transmis ; la proposition est une liste de
#   remplacements exacts, validée en J2 puis RÉAPPLIQUÉE par J4 à la base qu'il relit lui-même dans Git.
# - J4 candidat (AT-9.1) : seulement si J2 a conservé une proposition ; sans environnement ni secret, autre runner. Il construit le
#   commit candidat par la plomberie Git (aucun contenu proposé n'est exécuté) et le pousse en CRÉATION SEULE sur
#   atelier/<chantier>/<jalon>/<numero> : c'est la SEULE écriture du workflow (contents:write de J4, aucune autre branche, rien sur
#   main, aucun tag ; règles main-ecriture et atelier-integrite). La vérification AT-5 reste une demande séparée (aucune chaîne).
# - Aucune autre écriture : aucun tag, aucune écriture sur journal-atelier/*, aucune relance.
# - Les entrées passent par l'environnement, jamais interpolées dans une commande. persist-credentials: false.
# - Les faits sont dans le résumé du run : Christophe les copie et les colle sur son téléphone.

name: Atelier — AUTO à blanc
run-name: atelier-auto ${{ inputs.chantier }}/${{ inputs.jalon }}/${{ inputs.numero }}

on:
  workflow_dispatch:
    inputs:
      chantier:
        description: "chantier (demande AUTO)"
        required: true
        type: string
      jalon:
        description: "jalon (demande AUTO)"
        required: true
        type: string
      numero:
        description: "numero de la tentative (demande AUTO)"
        required: true
        type: string
      commit:
        description: "commit de journal-atelier/<chantier> (demande AUTO)"
        required: true
        type: string
      empreinte:
        description: "empreinte SHA-256 de chantier.json (demande AUTO)"
        required: true
        type: string

permissions: {}

jobs:
  garde:
    name: J1 garde
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: atelier-auto/${{ inputs.chantier }}/${{ inputs.jalon }}/${{ inputs.numero }}
      cancel-in-progress: false
    env:
      ATELIER_CHANTIER: ${{ inputs.chantier }}
      ATELIER_JALON: ${{ inputs.jalon }}
      ATELIER_NUMERO: ${{ inputs.numero }}
      ATELIER_COMMIT: ${{ inputs.commit }}
      ATELIER_EMPREINTE: ${{ inputs.empreinte }}
    steps:
      - name: Récupérer main (outils de la garde)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= v4)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (= v4)
        with:
          node-version: '22'
      - name: Lire la tête du journal et chantier.json
        run: |
          set -u
          D="$RUNNER_TEMP/atelier-auto"
          mkdir -p "$D"
          : > "$D/tete.txt"
          if [[ "$ATELIER_CHANTIER" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && [ "${#ATELIER_CHANTIER}" -le 40 ]; then
            if git fetch --no-tags --quiet origin "refs/heads/journal-atelier/$ATELIER_CHANTIER:refs/atelier-auto/journal"; then
              git rev-parse refs/atelier-auto/journal > "$D/tete.txt"
              git show refs/atelier-auto/journal:chantier.json > "$D/chantier.json" || rm -f "$D/chantier.json"
            fi
          fi
      - name: Lire l'historique des runs de ce workflow (témoin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          D="$RUNNER_TEMP/atelier-auto"
          W="repos/$GITHUB_REPOSITORY/actions/workflows/atelier-auto.yml/runs"
          if gh api "$W?per_page=1" --jq '.total_count' > "$D/total.txt" \
            && gh api --paginate "$W?per_page=100" --jq '.workflow_runs[] | {id, display_title, run_attempt, created_at} | tojson' > "$D/runs.jsonl"; then
            :
          else
            rm -f "$D/total.txt" "$D/runs.jsonl"
          fi
      - name: Garde (J1)
        run: node outils-atelier/auto-garde.mjs --dossier "$RUNNER_TEMP/atelier-auto"

  frontiere:
    name: J2 frontière et appel
    needs: garde
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: atelier-auto
    permissions:
      contents: read
      actions: read
    outputs:
      candidat: ${{ steps.proposition.outputs.candidat }}
    env:
      ATELIER_CHANTIER: ${{ inputs.chantier }}
      ATELIER_JALON: ${{ inputs.jalon }}
      ATELIER_NUMERO: ${{ inputs.numero }}
      ATELIER_COMMIT: ${{ inputs.commit }}
      ATELIER_EMPREINTE: ${{ inputs.empreinte }}
    steps:
      - name: Récupérer main (outils de la frontière)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= v4)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (= v4)
        with:
          node-version: '22'
      - name: Relire la tête du journal et chantier.json (après l'approbation)
        run: |
          set -u
          D="$RUNNER_TEMP/atelier-auto"
          mkdir -p "$D"
          : > "$D/tete.txt"
          if [[ "$ATELIER_CHANTIER" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && [ "${#ATELIER_CHANTIER}" -le 40 ]; then
            if git fetch --no-tags --quiet origin "refs/heads/journal-atelier/$ATELIER_CHANTIER:refs/atelier-auto/journal"; then
              git rev-parse refs/atelier-auto/journal > "$D/tete.txt"
              git show refs/atelier-auto/journal:chantier.json > "$D/chantier.json" || rm -f "$D/chantier.json"
            fi
          fi
      - name: Lire l'approbation de ce run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          D="$RUNNER_TEMP/atelier-auto"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$D/approbations.json" || rm -f "$D/approbations.json"
      - name: Sonde d'écriture du jeton (doit être refusée, 403)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          D="$RUNNER_TEMP/atelier-auto"
          gh api --include -X POST "repos/$GITHUB_REPOSITORY/git/blobs" -f content=atelier-auto-sonde -f encoding=utf-8 > "$D/sonde-sortie.txt" 2>&1
          echo "$?" > "$D/sonde-code.txt"
          exit 0
      - name: Frontière (J2) — aucun appel
        run: node outils-atelier/auto-frontiere.mjs --dossier "$RUNNER_TEMP/atelier-auto"
      - name: Lire les fichiers autorisés à la base (aucune requête)
        run: node outils-atelier/auto-dossier.mjs --dossier "$RUNNER_TEMP/atelier-auto" --depot .
      - name: Préparer l'appel (aucune requête)
        run: node outils-atelier/auto-appel.mjs --dossier "$RUNNER_TEMP/atelier-auto" --preparer
      - name: Appel (une seule requête)
        env:
          ATELIER_TEMOIN_CLE: ${{ secrets.ATELIER_TEMOIN_CLE }}
        run: node outils-atelier/auto-appel.mjs --dossier "$RUNNER_TEMP/atelier-auto" --reel
      - name: Proposition à conserver ?
        id: proposition
        run: |
          if [ -f "$RUNNER_TEMP/atelier-auto/proposition.json" ]; then echo "candidat=oui" >> "$GITHUB_OUTPUT"; fi
      - name: Conserver la proposition (remplacements validés, pour J4)
        if: steps.proposition.outputs.candidat == 'oui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (= v4)
        with:
          name: atelier-auto-proposition
          path: |
            ${{ runner.temp }}/atelier-auto/proposition.json
            ${{ runner.temp }}/atelier-auto/faits-appel.json
          if-no-files-found: error
          retention-days: 14

  candidat:
    name: J4 candidat
    needs: [garde, frontiere]
    if: github.ref == 'refs/heads/main' && needs.frontiere.outputs.candidat == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ATELIER_CHANTIER: ${{ inputs.chantier }}
      ATELIER_JALON: ${{ inputs.jalon }}
      ATELIER_NUMERO: ${{ inputs.numero }}
      ATELIER_COMMIT: ${{ inputs.commit }}
      ATELIER_EMPREINTE: ${{ inputs.empreinte }}
    steps:
      - name: Récupérer main (outil du candidat)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= v4)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (= v4)
        with:
          node-version: '22'
      - name: Relire la tête du journal et chantier.json
        run: |
          set -u
          D="$RUNNER_TEMP/atelier-auto"
          mkdir -p "$D"
          : > "$D/tete.txt"
          if [[ "$ATELIER_CHANTIER" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && [ "${#ATELIER_CHANTIER}" -le 40 ]; then
            if git fetch --no-tags --quiet origin "refs/heads/journal-atelier/$ATELIER_CHANTIER:refs/atelier-auto/journal"; then
              git rev-parse refs/atelier-auto/journal > "$D/tete.txt"
              git show refs/atelier-auto/journal:chantier.json > "$D/chantier.json" || rm -f "$D/chantier.json"
            fi
          fi
      - name: Récupérer la proposition de ce run (artefact de J2)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (= v4)
        with:
          name: atelier-auto-proposition
          path: ${{ runner.temp }}/atelier-auto
      - name: Construire le commit candidat (aucun contenu proposé exécuté)
        id: construire
        run: node outils-atelier/auto-candidat.mjs --dossier "$RUNNER_TEMP/atelier-auto" --construire --depot .
      - name: Créer la branche candidate (création seule)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          D="$RUNNER_TEMP/atelier-auto"
          B="$(cat "$D/candidat-branche.txt")"
          S="$(cat "$D/candidat-sha.txt")"
          if ! [[ "$B" =~ ^atelier/[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*/[1-9][0-9]{0,2}$ ]] || ! [[ "$S" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git push --no-verify --force-with-lease="refs/heads/$B:" origin "$S:refs/heads/$B" || echo "poussée refusée"
          git ls-remote origin "refs/heads/$B" | cut -f1 > "$D/distant.txt" || : > "$D/distant.txt"
      - name: Constater le candidat (J4)
        if: always() && steps.construire.outcome == 'success'
        run: node outils-atelier/auto-candidat.mjs --dossier "$RUNNER_TEMP/atelier-auto" --constater

  constat:
    name: J3 constat
    needs: [garde, frontiere]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      ATELIER_CHANTIER: ${{ inputs.chantier }}
      ATELIER_JALON: ${{ inputs.jalon }}
      ATELIER_NUMERO: ${{ inputs.numero }}
      ATELIER_COMMIT: ${{ inputs.commit }}
      ATELIER_EMPREINTE: ${{ inputs.empreinte }}
    steps:
      - name: Récupérer main (outil du constat)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= v4)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (= v4)
        with:
          node-version: '22'
      - name: Lire les jobs de ce run (essai courant)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          D="$RUNNER_TEMP/atelier-auto"
          mkdir -p "$D"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs' > "$D/jobs.json" || rm -f "$D/jobs.json"
      - name: Constat (J3)
        run: node outils-atelier/auto-constat.mjs --dossier "$RUNNER_TEMP/atelier-auto"
